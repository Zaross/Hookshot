[package]
name = "hookshot"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
regex = "1"
totp-rs = { version = "5.7.1", features = ["gen_secret", "otpauth"] }
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
